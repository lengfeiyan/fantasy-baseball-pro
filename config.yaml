# Fantasy Baseball Pro 配置文件
# 版本: 2026.0

# 数据处理配置
data:
  # 生效赛季（排名文件名、抓取默认年份随之变化；默认当前年）
  season: 2026
  # 是否启用多源预测融合
  use_multi_source: true
  # 数据文件命名模板（支持 {source} 与 {season} 占位符；多源模式用）
  file_patterns:
    hitters: "hitters_{season}_{source}.csv"
    pitchers: "pitchers_{season}_{source}.csv"
  # 位置映射文件
  positions_file: "data/player_positions_2025.csv"

# 预测源权重配置
projections:
  # 权重分配（总和必须为1.0）
  weights:
    STEAMER: 0.7
    ZIPS: 0.3
    # THE_BAT: 0.0
  # 支持的预测源
  sources:
    - STEAMER
    - ZIPS
    # - THE_BAT

# 联盟规则配置
league:
  # 联盟规模
  size: 12
  # 选秀轮数
  rounds: 15
  # 阵容槽位
  roster_slots:
    C: 1
    1B: 1
    2B: 1
    3B: 1
    SS: 1
    OF: 4
    SP: 4
    RP: 3
    UTIL: 1
  # 评分规则
  scoring:
    # 打者评分（正值为加分，负值为减分）
    hitters:
      R: 1      # 得分
      HR: 1     # 本垒打
      RBI: 1    # 打点
      SB: 1     # 盗垒
      AVG: 1    # 打击率
      # OBP: 1   # 上垒率（如需使用，注释掉AVG）
    # 投手评分
    pitchers:
      W: 1       # 胜场
      SV: 1      # 救援成功
      HOLD: 1    # 中继成功
      ERA: -1    # 自责分率（越低越好）
      WHIP: -1   # WHIP（越低越好）
      K_per_9: 1 # 每9局三振数

# 选秀模拟器配置
draft_simulator:
  # 默认选秀策略: conservative / balanced / aggressive
  default_strategy: "balanced"
  # 是否显示价值股提示
  show_value_picks: true
  # ADP文件路径
  adp_file: "adp.csv"

# 风险模型配置
risk_model:
  # 上下限计算方法: z_score / historical_variance
  method: "z_score"
  # 风险调整系数（值越大，风险影响越大）
  adjustment_factor: 0.1

# 替代水平配置
scoring:
  # stream 席位数：这些位置的球员本质上是替代水平（日替/stream FA）
  # 用于动态替代水平计算：固定球员数 = league_size × (total_slots - stream_slots)
  # 替代水平 = 该位置排名最后的固定球员的评分
  stream_slots: 5

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # 日志文件路径
  file: "fantasy_baseball.log"

# FA分析配置
fa_analyzer:
  # 数据更新频率（小时）
  update_frequency: 6
  # 默认推荐数量
  default_top_n: 10
  # 数据来源优先级
  data_sources:
    - MLB_API
    - FANGRAPHS
    - ESPN
  # 推荐算法参数
  algorithm:
    position_weight: 0.3
    performance_weight: 0.4
    risk_weight: 0.2
    opportunity_weight: 0.1
  # 风险模型配置
  risk_model:
    # 风险偏好默认值: conservative / balanced / aggressive
    default_preference: "balanced"
    # 伤病影响权重
    injury_weight: 0.3
  # 缓存配置
  cache:
    # 缓存过期时间（小时）
    expiry: 24
    # 缓存目录
    directory: "data/cache"

# SGP（Standings Gain Points）配置
# 与 VORP 并行的另一种评分体系，专为 5×5 Roto 联盟设计
sgp:
  # SGP 分母：每升一名需要多少统计量（12 队联盟经验值）
  # 可根据你的联盟规模/历史数据调整
  denominators:
    hitters:
      R: 24.6        # 得分
      HR: 10.4       # 本垒打
      RBI: 24.6      # 打点
      SB: 9.4        # 盗垒
      AVG: 0.0024    # 打击率
    pitchers:
      W: 3.03        # 胜场
      SV: 9.95       # 救援
      K: 39.3        # 三振
      ERA: -0.076    # 自责分率（负值，越低越好）
      WHIP: -0.015   # WHIP（负值）
